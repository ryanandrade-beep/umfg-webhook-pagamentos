<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobranças PIX · Demonstração</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --fundo: #0a0d0b; --cartao: rgba(28, 38, 30, .7); --campo: #121813;
            --tinta: #ffffff; --suave: #9aa59c; --borda: rgba(151, 224, 96, .16);
            --marca: #97e060; --marca-hover: #a9ea7c; --marca-fg: #0a0d0b;
            --pendente: #f5b544; --pendente-bg: rgba(245, 181, 68, .14);
            --aprovado: #97e060; --aprovado-bg: rgba(151, 224, 96, .14);
            --recusado: #ff7a6b; --recusado-bg: rgba(255, 122, 107, .14);
            --cancelado: #b4bcb6; --cancelado-bg: rgba(180, 188, 182, .14);
            --display: "Space Grotesk", system-ui, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Inter", "Instrument Sans", system-ui, -apple-system, sans-serif;
            background: radial-gradient(ellipse at 20% -10%, rgba(151, 224, 96, .12), transparent 45%), var(--fundo);
            color: var(--tinta); line-height: 1.55; min-height: 100vh; color-scheme: dark;
        }
        main { max-width: 1000px; margin: 0 auto; padding: 28px 16px 64px; display: grid; gap: 20px; grid-template-columns: 1fr 1fr; align-items: start; }
        .brand { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; letter-spacing: .04em; }
        .brand::before { content: "Z"; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--marca); color: var(--marca-fg); }
        .card { background: var(--cartao); border: 1px solid var(--borda); border-radius: 24px; padding: 28px; backdrop-filter: blur(8px); }
        .eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--marca); font-weight: 700; }
        h1, h2 { font-family: var(--display); letter-spacing: -.02em; }
        h1 { font-size: 2rem; line-height: 1.15; margin: 6px 0; }
        h2 { font-size: 1.15rem; }
        .intro { color: var(--suave); margin-bottom: 8px; }
        label { display: block; font-size: .78rem; font-weight: 600; color: var(--suave); margin: 14px 0 6px; }
        input, select { width: 100%; font: inherit; color: var(--tinta); padding: 11px 14px; border: 1px solid var(--borda); border-radius: 14px; background: var(--campo); }
        input::placeholder { color: #5f6b62; }
        input:focus, select:focus, button:focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; }
        button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 12px 22px; background: var(--marca); color: var(--marca-fg); cursor: pointer; margin-top: 18px; width: 100%; transition: background .15s; }
        button:hover:not(:disabled) { background: var(--marca-hover); }
        button:disabled { opacity: .45; cursor: not-allowed; }
        .mensagem { margin-top: 14px; padding: 10px 16px; border-radius: 14px; font-weight: 600; font-size: .9rem; }
        .mensagem:empty { display: none; }
        .mensagem.erro { background: var(--recusado-bg); color: var(--recusado); }
        .mensagem.ok { background: var(--aprovado-bg); color: var(--aprovado); }
        #result { margin-top: 22px; padding-top: 22px; border-top: 1px dashed var(--borda); text-align: center; }
        #result[hidden] { display: none; }
        .amount { font-family: var(--display); font-size: 2.2rem; font-weight: 700; }
        .qr { margin: 14px auto 6px; width: 172px; height: 172px; background: #fff; border-radius: 18px; display: grid; place-items: center; }
        .qr img { width: 150px; height: 150px; }
        .subtle { color: var(--suave); font-size: .8rem; word-break: break-all; }
        .selo { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: .78rem; font-weight: 700; margin: 8px 0; }
        .st-pending { background: var(--pendente-bg); color: var(--pendente); }
        .st-approved { background: var(--aprovado-bg); color: var(--aprovado); }
        .st-rejected { background: var(--recusado-bg); color: var(--recusado); }
        .st-cancelled { background: var(--cancelado-bg); color: var(--cancelado); }
        .simular { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; margin-top: 14px; text-align: left; }
        .simular button { margin-top: 0; width: auto; }
        .lista-topo { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 14px; }
        .lista-topo select { width: auto; border-radius: 999px; padding: 8px 14px; }
        ul.pagamentos { list-style: none; display: grid; gap: 10px; }
        ul.pagamentos li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border: 1px solid var(--borda); border-radius: 16px; cursor: pointer; background: var(--campo); transition: border-color .15s; }
        ul.pagamentos li:hover { border-color: var(--marca); }
        ul.pagamentos .selo { margin: 0; white-space: nowrap; }
        .vazio { color: var(--suave); text-align: center; padding: 20px 0; }
        @media (max-width: 760px) { main { grid-template-columns: 1fr; } h1 { font-size: 1.6rem; } }
    </style>
</head>
<body>
    <main>
        <div class="brand">Oficina de Webhook</div>

        <section class="card">
            <div class="eyebrow">Ambiente demonstrativo</div>
            <h1>Receber por PIX</h1>
            <p class="intro">Crie uma cobrança e acompanhe o status.</p>

            <form id="payment-form" novalidate>
                <label for="cliente">Nome do cliente</label>
                <input type="text" id="cliente" name="cliente" autocomplete="name" placeholder="Ex: Ana Silva" maxlength="255">
                <label for="valor">Valor em reais</label>
                <input type="number" id="valor" name="valor" min="0.01" step="0.01" placeholder="50,00">
                <button id="create-button" type="submit">Gerar cobrança</button>
            </form>

            <p id="mensagem" class="mensagem" role="status"></p>

            <div id="result" hidden>
                <div class="eyebrow">Cobrança criada</div>
                <div id="cliente-resultado" class="subtle"></div>
                <div id="amount" class="amount"></div>
                <div class="qr"><img alt="QR Code ilustrativo, não pagável" id="qr-image"></div>
                <p class="subtle">QR Code ilustrativo (não pagável)</p>
                <div id="status" class="selo st-pending">Aguardando pagamento</div>
                <p id="payment-id" class="subtle"></p>
                <div class="simular">
                    <select id="status-simulado" aria-label="Status da notificação simulada">
                        <option value="approved">Aprovado</option>
                        <option value="rejected">Recusado</option>
                        <option value="cancelled">Cancelado</option>
                    </select>
                    <button id="simulate-button" type="button">Simular recebimento</button>
                </div>
            </div>
        </section>

        <section class="card">
            <div class="lista-topo">
                <h2>Cobranças</h2>
                <select id="filtro-status" aria-label="Filtrar por status">
                    <option value="">Todas</option>
                    <option value="pending">Pendentes</option>
                    <option value="approved">Aprovadas</option>
                    <option value="rejected">Recusadas</option>
                    <option value="cancelled">Canceladas</option>
                </select>
            </div>
            <ul id="lista" class="pagamentos"></ul>
            <p id="vazio" class="vazio" hidden>Nenhuma cobrança encontrada.</p>
        </section>
    </main>

    <script>
        const ROTULOS = {
            pending: "Aguardando pagamento",
            approved: "Pago",
            rejected: "Recusado",
            cancelled: "Cancelado"
        };

        const form = document.querySelector("#payment-form");
        const createButton = document.querySelector("#create-button");
        const simulateButton = document.querySelector("#simulate-button");
        const result = document.querySelector("#result");
        const mensagem = document.querySelector("#mensagem");
        const statusLabel = document.querySelector("#status");
        const lista = document.querySelector("#lista");
        const vazio = document.querySelector("#vazio");
        const filtroStatus = document.querySelector("#filtro-status");

        let payment = null;

        const moeda = (valor) => Number(valor).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

        function mostrar(texto, tipo) {
            mensagem.textContent = texto;
            mensagem.className = `mensagem ${tipo || ""}`;
        }

        async function requisitar(url, opcoes) {
            let resposta;
            try {
                resposta = await fetch(url, opcoes);
            } catch {
                throw new Error("Não foi possível conectar ao servidor.");
            }
            const dados = await resposta.json().catch(() => ({}));
            if (!resposta.ok) {
                const detalhes = dados.detalhes ? ` (${dados.detalhes.join("; ")})` : "";
                throw new Error((dados.erro || "Erro inesperado") + detalhes);
            }
            return dados;
        }

        function exibirPagamento(dados) {
            payment = dados;
            result.hidden = false;
            document.querySelector("#cliente-resultado").textContent = dados.cliente;
            document.querySelector("#amount").textContent = moeda(dados.valor);
            document.querySelector("#payment-id").textContent = `ID: ${dados.id}`;
            document.querySelector("#qr-image").src =
                `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent("DEMO-PIX-" + dados.id)}`;
            statusLabel.textContent = ROTULOS[dados.status];
            statusLabel.className = `selo st-${dados.status}`;
            simulateButton.disabled = dados.status !== "pending";
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            mostrar("");

            const cliente = form.cliente.value.trim();
            const valor = Number(form.valor.value);
            if (!cliente) return mostrar("Informe o nome do cliente.", "erro");
            if (!form.valor.value || !(valor > 0)) return mostrar("Informe um valor maior que zero.", "erro");

            createButton.disabled = true;
            createButton.textContent = "Criando cobrança...";
            try {
                const dados = await requisitar("/pagamentos", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ cliente, valor })
                });
                exibirPagamento(dados.pagamento);
                mostrar("Cobrança criada com sucesso!", "ok");
                form.reset();
                carregarLista();
            } catch (erro) {
                mostrar(erro.message, "erro");
            } finally {
                createButton.disabled = false;
                createButton.textContent = "Gerar cobrança";
            }
        });

        simulateButton.addEventListener("click", async () => {
            if (!payment) return;
            simulateButton.disabled = true;
            try {
                const dados = await requisitar("/simulacao/webhook", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        pagamentoId: payment.id,
                        status: document.querySelector("#status-simulado").value
                    })
                });
                exibirPagamento(dados.pagamento);
                mostrar("Notificação recebida: status atualizado!", "ok");
                carregarLista();
            } catch (erro) {
                mostrar(erro.message, "erro");
                simulateButton.disabled = payment.status !== "pending";
            }
        });

        async function carregarLista() {
            const status = filtroStatus.value;
            try {
                const dados = await requisitar(`/pagamentos?limite=10${status ? "&status=" + status : ""}`);
                lista.innerHTML = "";
                vazio.hidden = dados.pagamentos.length > 0;
                for (const p of dados.pagamentos) {
                    const item = document.createElement("li");
                    const nome = document.createElement("span");
                    nome.textContent = `${p.cliente} · ${moeda(p.valor)}`;
                    const selo = document.createElement("span");
                    selo.className = `selo st-${p.status}`;
                    selo.textContent = ROTULOS[p.status];
                    item.append(nome, selo);
                    item.addEventListener("click", () => exibirPagamento(p));
                    lista.append(item);
                }
            } catch (erro) {
                mostrar(erro.message, "erro");
            }
        }

        filtroStatus.addEventListener("change", carregarLista);
        carregarLista();
    </script>
</body>
</html>
